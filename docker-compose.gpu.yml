services:
  app:
    environment:
      LLAMA_N_GPU_LAYERS: "${LLAMA_N_GPU_LAYERS:-999}"

  llama-server:
    image: "${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}"
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}"
    command:
      - -hf
      - rootonchair/Vintern-1B-v3_5-GGUF-ext:Q4_K_M
      - --mmproj
      - /models/mmproj-Vintern-1B-v3_5-Q8_0.gguf
      - --chat-template
      - vicuna
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --n-gpu-layers
      - "${LLAMA_N_GPU_LAYERS:-999}"
