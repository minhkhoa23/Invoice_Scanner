name: invoice-scanner

services:
  app:
    build: .
    image: invoice-scanner:local
    depends_on:
      - llama-server
    ports:
      - "8000:8000"
    environment:
      OCR_SERVER_URL: "${OCR_SERVER_URL:-http://llama-server:8081/v1}"
      OCR_SERVER_MODEL: "${OCR_SERVER_MODEL:-local-model}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-20}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}"
    volumes:
      - invoice-storage:/app/backend/storage

  llama-server:
    image: "${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}"
    command:
      - -hf
      - rootonchair/Vintern-1B-v3_5-GGUF-ext:Q4_K_M
      - --mmproj
      - /models/mmproj-Vintern-1B-v3_5-Q8_0.gguf
      - --chat-template
      - vicuna
      - --host
      - 0.0.0.0
      - --port
      - "8081"
    ports:
      - "8081:8081"
    volumes:
      - ./models:/models:ro
      - llama-cache:/root/.cache

volumes:
  invoice-storage:
  llama-cache:
